const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptApp(password) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' }, km, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  const text = new TextDecoder().decode(buf);
  if (!text.startsWith('CASA_OK|')) throw new Error('sello');
  return text.slice(8);
}
async function enter() {
  const btn = document.getElementById('go'), err = document.getElementById('err'), pw = document.getElementById('pw').value;
  if (!pw) { err.textContent = 'Introduce la contraseÃ±a.'; return; }
  btn.disabled = true; err.textContent = 'Descifrandoâ€¦';
  try {
    const html = await decryptApp(pw);
    try { localStorage.setItem('casa_pw', pw); } catch(_) {}
    gidb('pw', pw);
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(_) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { localStorage.removeItem('casa_pw'); } catch(_) {}
    gidb('pw', '');
    err.textContent = 'ContraseÃ±a incorrecta.'; btn.disabled = false;
    document.querySelector('.gate').style.visibility = 'visible';
  }
}

document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
// Clave recordada: se guarda en dos almacenes (localStorage e IndexedDB) por si el navegador borra uno
const gidb = (k, v) => new Promise(res => { try {
  const r = indexedDB.open('gastos-casa-acceso', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('s');
  r.onerror = () => res();
  r.onsuccess = () => {
    const wr = v !== undefined, t = r.result.transaction('s', wr ? 'readwrite' : 'readonly'), s = t.objectStore('s');
    if (wr) { s.put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(); }
    else { const g = s.get(k); g.onsuccess = () => res(g.result); g.onerror = () => res(); }
  };
} catch(_) { res(); } });
(async () => {
  let saved = null;
  try { saved = localStorage.getItem('casa_pw'); } catch(_) {}
  if (!saved) saved = await gidb('pw');
  if (saved) { document.querySelector('.gate').style.visibility = 'hidden'; document.getElementById('pw').value = saved; enter(); }
})();
